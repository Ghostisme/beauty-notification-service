version: '3.8'

services:
  # 主服务
  notification-service:
    build: .
    container_name: beauty-notification
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - TZ=Asia/Shanghai
      - LOG_LEVEL=info
      # 从 .env 文件加载抖音密钥
      - DOUYIN_APP_ID=${DOUYIN_APP_ID}
      - DOUYIN_APP_SECRET=${DOUYIN_APP_SECRET}
    env_file:
      - .env
    volumes:
      # 只读挂载配置文件
      - ./data:/app/data:ro
      # 日志持久化
      - ./logs:/app/logs
    networks:
      - app-network
    # 资源限制（适配 2GB 内存服务器）
    deploy:
      resources:
        limits:
          cpus: '0.8'      # 限制使用 80% CPU
          memory: 1G       # 限制 1GB 内存
        reservations:
          cpus: '0.2'
          memory: 256M
    # 日志限制（防止日志文件过大）
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Redis（消息队列，可选但推荐）
  redis:
    image: redis:7-alpine
    container_name: beauty-redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
    volumes:
      - redis-data:/data
    networks:
      - app-network
    deploy:
      resources:
        limits:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

networks:
  app-network:
    driver: bridge

volumes:
  redis-data:
    driver: local
