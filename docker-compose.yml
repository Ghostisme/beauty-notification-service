# 后端 API 容器(前端由宿主机全局 nginx 静态托管, /api 反代到 127.0.0.1:8787)
# 启动: ADMIN_TOKEN=$(openssl rand -hex 24) docker compose up -d --build
services:
  dylk-admin:
    build: .
    container_name: dylk-admin
    restart: unless-stopped
    # 只绑本机回环, 公网访问一律经 nginx, 不直接暴露 8787
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      # 配置与前端不在镜像里, 跟宿主机保持一致, 改完重启容器即生效
      - ./config.json:/app/config.json
      - ./data:/app/data
      - ./state:/app/state
      - ./logs:/app/logs
    environment:
      - TZ=Asia/Shanghai
      - ADMIN_HOST=0.0.0.0
      - ADMIN_PORT=8787
      - STATE_DIR=/app/state
      # 公网部署必填: docker compose 启动前在 shell 里 export ADMIN_TOKEN=xxx
      - ADMIN_TOKEN=${ADMIN_TOKEN:?请在环境变量中设置 ADMIN_TOKEN}
      # 来客凭证也可走环境变量(优先于 config.json)
      # - DOUYIN_CLIENT_KEY=xxx
      # - DOUYIN_CLIENT_SECRET=xxx

  # 可选: 订单自动拉取常驻服务(默认不启动)
  # 启动: docker compose --profile sync up -d
  dylk-sync:
    build: .
    container_name: dylk-sync
    restart: unless-stopped
    profiles: ["sync"]
    command: ["python", "sync.py", "--serve"]
    volumes:
      - ./config.json:/app/config.json
      - ./data:/app/data
      - ./state:/app/state
      - ./logs:/app/logs
    environment:
      - TZ=Asia/Shanghai
      - STATE_DIR=/app/state
