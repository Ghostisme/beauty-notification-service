# Replace the application location in the EXISTING HTTPS server block for
# notification.hongquanquan.cn. Keep its certificate and renewal configuration.
# Remove obsolete application /api, static and try_files locations that would
# override this route. Retain any confirmed legacy lead callback separately.
location / {
    client_max_body_size 2m;
    proxy_pass http://127.0.0.1:8790;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_connect_timeout 5s;
    proxy_send_timeout 35s;
    proxy_read_timeout 35s;
}
