services:
  tool:
    build: .
    image: laike-wecom-tool:1.0.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:8790:8790"
    environment:
      COOKIE_SECURE: "true"
      TZ: Asia/Shanghai
    volumes:
      - ./data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    mem_limit: 384m
    mem_reservation: 96m
    cpus: 0.8
    pids_limit: 64
    stop_grace_period: 90s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8790/health',timeout=5).read()"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 20s
